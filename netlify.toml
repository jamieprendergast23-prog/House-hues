  SITE_URL = "https://app.houseandhues.com.au"

[functions]
  node_bundler = "esbuild"

# single-page app: every route (e.g. /i/HH-0042 from a QR scan) loads the app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self)"
